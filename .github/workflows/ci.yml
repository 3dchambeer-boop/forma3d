# Release gate. Runs scripts/verify-production.sh --strict: Prisma, app typecheck, lint, Next.js build, a smoke run
# that checks /api/health and that protected routes refuse anonymous requests, all tests, the real OpenCascade
# kernel (built from source, cached) and the real OrcaSlicer CLI. Any skipped step fails the job.
name: verify
on:
  push:
    branches: [main, "phase-*"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Node dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages (OCCT build, OrcaSlicer headless)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libfreetype-dev libfontconfig-dev libgl-dev libegl-dev xvfb
      - name: Python test dependencies
        run: python -m pip install -r services/ai_3d_engine/requirements-dev.txt
      - name: Restore OpenCascade build
        uses: actions/cache@v4
        with:
          path: .occt/build
          key: occt-7.8.1-${{ runner.os }}-${{ hashFiles('scripts/build-occt-native.sh') }}
      - name: Build OpenCascade 7.8.1 + forma_occ
        run: scripts/build-occt-native.sh .occt
      - name: OrcaSlicer headless
        run: scripts/orcaslicer-headless-setup.sh "$RUNNER_TEMP/orca"
      - name: Production gate (strict)
        env:
          FORMA_OCC_BIN: ${{ github.workspace }}/services/cad_engine/native/build/forma_occ
          LD_LIBRARY_PATH: ${{ github.workspace }}/.occt/build/lin64/gcc/lib
          ORCASLICER_BIN: ${{ runner.temp }}/orca/orca-headless
          ORCASLICER_PROFILE_DIR: ${{ runner.temp }}/orca/presets
        run: scripts/verify-production.sh --strict
